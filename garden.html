<body style="overflow: hidden;">

    <div class="nav-options">
      <a href="projects.html">Projects</a>
      <a href="aboutme.html">About</a>

        <img src="./assets/tree.png">
      </a>

  <div id="canvas">
    <canvas id="jagged-bg"></canvas>
    <canvas id="bonsaiCanvas"></canvas>
  </div>

  <button id="floating-btn" class="bouncing-item">Reset</button>

  <script src="./static/background.js"></script>
  <script src="./static/garden.js"></script>
  <script src="./static/reset-bounce.js"></script>
  <script>
    Module.onRuntimeInitialized = () => {
      const canvas = document.getElementById('bonsaiCanvas');

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const canvas2 = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      const tree = new Module.BonsaiTree((Math.random() * 2) + 1);

      let windTime = 0;

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        windTime += 0.03;

        const segments = tree.generateSegments(canvas.width / 2, canvas.height - 50, windTime, 0.50);

        for (let i = 0; i < segments.size(); i++) {
          const seg = segments.get(i);

          ctx.beginPath();
          ctx.moveTo(seg.x1, seg.y1);
          ctx.lineTo(seg.x2, seg.y2);

          ctx.lineWidth = Math.max(2, 10 - seg.depth * 1.5);
          ctx.strokeStyle = seg.depth >= 2 ? '#a8c3a0' : '#5c4033';
          ctx.lineCap = 'round';
          ctx.stroke();
        }

        segments.delete();

        ctx.save();
        ctx.font = '500 18px system-ui, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('click the canvas anywhere to grow me!', canvas.width / 2, canvas.height - 40);
        ctx.restore();

        requestAnimationFrame(render);
      }
      canvas2.addEventListener('click', () => tree.grow());
      render();

      const floatingButton = document.getElementById('floating-btn');
        floatingButton.addEventListener('click', (e) => {
        e.stopPropagation();
        tree.reset();
      });
    }
  </script>

  <button class="home-btn">
