<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>portfolio</title>

</head>

<body style="overflow: hidden;">
  <div class="navbar">
    <div class="nav-name">
      <p class="name">Eric Ning</p>
    </div>

    <div class="nav-options">
      <a href="projects.html">Projects</a>
      <a href="aboutme.html">About</a>
      <a href="garden.html">
        <img src="./assets/tree.png">
      </a>
    </div>
  </div>
  <div id="canvas">
    <canvas id="jagged-bg"></canvas>
    <canvas id="bonsaiCanvas"></canvas>
  </div>

  <button id="floating-btn" class="bouncing-item">Reset</button>

  <script src="./static/background.js"></script>
  <script src="./static/garden.js"></script>
  <script>
    const floatingButton = document.getElementById('floating-btn');

    let posX = Math.random() * (window.innerWidth - 100);
    let posY = Math.random() * (window.innerHeight - 100);

    let vx = 0.3;
    let vy = 0.1;

    function animate() {
      const rect = floatingButton.getBoundingClientRect();
      const maxX = window.innerWidth - rect.width;
      const maxY = window.innerHeight - rect.height;

      posX += vx;
      posY += vy;

      if (posX <= 0) {
        posX = 0;
        vx *= -1;
      } 
      else if (posX >= maxX) {
        posX = maxX;
        vx *= -1;
      }

      if (posY <= 0) {
        posY = 0;
        vy *= -1;
      } 
      else if (posY >= maxY) {
        posY = maxY;
        vy *= -1;
      }

      floatingButton.style.transform = `translate(${posX}px, ${posY}px)`;

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      const rect = floatingButton.getBoundingClientRect();
      if (posX > window.innerWidth - rect.width) posX = window.innerWidth - rect.width;
      if (posY > window.innerHeight - rect.height) posY = window.innerHeight - rect.height;
    });
  </script>
  <script>
    Module.onRuntimeInitialized = () => {
      const canvas = document.getElementById('bonsaiCanvas');

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const canvas2 = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      const tree = new Module.BonsaiTree((Math.random() * 2) + 1);

      let windTime = 0;

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        windTime += 0.03;

        const segments = tree.generateSegments(canvas.width / 2, canvas.height - 50, windTime, 0.50);

        for (let i = 0; i < segments.size(); i++) {
          const seg = segments.get(i);

          ctx.beginPath();
          ctx.moveTo(seg.x1, seg.y1);
          ctx.lineTo(seg.x2, seg.y2);

          ctx.lineWidth = Math.max(1, 8 - seg.depth * 1.5);
          ctx.strokeStyle = seg.depth >= 2 ? '#a8c3a0' : '#5c4033';
          ctx.lineCap = 'round';
          ctx.stroke();
        }

        segments.delete();
        requestAnimationFrame(render);
      }
      canvas2.addEventListener('click', () => tree.grow());
      render();

      const floatingButton = document.getElementById('floating-btn');
        floatingButton.addEventListener('click', (e) => {
        e.stopPropagation();
        tree.reset();
      });
    }
  </script>

  <button class="home-btn">
    <a href="index.html">
      <span class="btn-content-wrapper">
        <img src="./assets/home-icon.png" class="btn-icon">

  </button>

  </div>
</body>
